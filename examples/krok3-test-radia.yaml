# SIHOS16 — test kroku 3: radio CC1101 + dekoder.
# Liczniki nie są jeszcze konfigurowane: moduł loguje każdą odebraną ramkę
# (tryb, RSSI, producent, numer, typ, wynik dekodowania) i co minutę statystykę radia.
# Ramki zaszyfrowane pokażą „brak klucza” — klucze dojdą w kroku 4.

esphome:
  name: sihos16
  friendly_name: SIHOS16

esp32:
  board: lolin_s3_mini
  variant: ESP32S3
  cpu_frequency: 160MHz
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

external_components:
  - source: github://smartinhome/sihos16@main
    components: [sihos16]
    refresh: 0s

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

sihos16:
  cs_pin: GPIO10
  gdo0_pin: GPIO21
  gdo2_pin: GPIO14
