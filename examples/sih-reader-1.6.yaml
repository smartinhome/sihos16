# SIHOS16 — SIH Reader 1.6 (LOLIN S3 mini + CC1101).
#
# Pierwsze uruchomienie (i po przywróceniu ustawień fabrycznych):
#   moduł nie zna żadnej sieci, więc uruchamia hotspot „SIH Reader” (dioda niebieska).
#   Połącz się z nim telefonem (hasło niżej) — otworzy się strona modułu:
#   wybierz swoją sieć WiFi, wpisz hasło, zapisz. Potem dodaj liczniki na tej samej stronie.
# W Twojej sieci strona jest pod: http://sih-reader.local/
# Każdy licznik pojawia się w Home Assistant jako osobne urządzenie.

esphome:
  name: sih-reader
  friendly_name: SIH Reader
  project:
    name: smartinhome.sihos16
    version: "16.0.0"

esp32:
  board: lolin_s3_mini
  variant: ESP32S3
  cpu_frequency: 160MHz
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic   # zalecenie ESPHome: mniej pamięci IRAM na obsługę pamięci flash

logger:
  level: INFO   # DEBUG pokazuje też każdą ramkę i każde pole

api:

ota:
  - platform: esphome
  - platform: web_server   # aktualizacja plikiem .bin ze strony modułu

wifi:
  # Sieci nie ma w YAML — klient wpisuje ją na stronie modułu (zapis w pamięci modułu).
  # Do własnych testów możesz dopisać:  ssid: !secret wifi_ssid  i  password: !secret wifi_password
  ap:
    ssid: "SIH Reader"
    password: "smartinhome"   # zmień i wydrukuj na naklejce modułu

captive_portal:   # telefon sam otworzy stronę modułu po połączeniu z hotspotem

external_components:
  - source: github://smartinhome/sihos16@main
    components: [sihos16]
    refresh: 0s

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

output:
  - platform: gpio
    id: led_ramki
    pin: GPIO18
    inverted: true

light:
  - platform: esp32_rmt_led_strip
    id: led_rgb
    internal: true          # sterowana przez moduł (stan WiFi / Home Assistant)
    pin: GPIO47
    chipset: WS2812
    num_leds: 1
    channel_colors: RGB
    default_transition_length: 0s
    gamma_correct: 2.8
    restore_mode: ALWAYS_OFF

sihos16:
  cs_pin: GPIO10
  gdo0_pin: GPIO21
  gdo2_pin: GPIO14
  rgb_led: led_rgb
  status_led: led_ramki
  factory_reset_pin:        # przycisk BOOT: przytrzymanie 10 s = ustawienia fabryczne
    number: GPIO0
    ignore_strapping_warning: true   # GPIO0 to przycisk BOOT płytki — tylko odczyt, bezpieczne
    inverted: true
    mode:
      input: true
      pullup: true
