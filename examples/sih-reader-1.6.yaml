# SIHOS16 — SIH Reader 1.6 (LOLIN S3 mini + CC1101).
# Liczniki dodaje się na stronie modułu: http://<adres modułu>/  (lub /sihos16)
# Każdy licznik pojawia się w Home Assistant jako osobne urządzenie.

esphome:
  name: sih-reader
  friendly_name: SIH Reader
  project:
    name: smartinhome.sihos16
    version: "16.0.0"

esp32:
  board: lolin_s3_mini
  variant: ESP32S3
  cpu_frequency: 160MHz
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO   # DEBUG pokazuje też każdą ramkę i każde pole

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:            # bez dostępu do sieci moduł tworzy własną sieć z portalem konfiguracji WiFi

captive_portal:

external_components:
  - source: github://smartinhome/sihos16@main
    components: [sihos16]
    refresh: 0s

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

sihos16:
  cs_pin: GPIO10
  gdo0_pin: GPIO21
  gdo2_pin: GPIO14
